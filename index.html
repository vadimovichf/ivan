<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>С днём рождения, Юля! — Джекпот</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Russo+One&family=Yeseva+One&display=swap" rel="stylesheet">
<style>
:root{
  --red:#a80f1f; --red-d:#5e0610; --red-l:#d81f33;
  --gold:#f5c542; --gold-d:#9a6a12; --gold-l:#fff1b0;
  --cream:#fbf3dc; --ink:#1a0508;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:"Russo One","Arial Black",Impact,sans-serif;color:var(--gold-l);
  background:
    radial-gradient(ellipse at 50% 0%,#4a0a14 0%,#1a0408 55%,#0a0103 100%);
  min-height:100dvh;display:flex;justify-content:center;align-items:flex-start;
  overflow-x:hidden;user-select:none;-webkit-user-select:none;touch-action:manipulation;
}
.machine{width:100%;max-width:430px;padding:10px 10px 18px;display:flex;flex-direction:column;gap:10px}

/* ---------- marquee ---------- */
.marquee{
  position:relative;text-align:center;padding:16px 14px 12px;border-radius:120px 120px 18px 18px/70px 70px 18px 18px;
  background:linear-gradient(180deg,var(--red-l),var(--red) 55%,var(--red-d));
  border:4px solid var(--gold);
  box-shadow:0 0 0 3px var(--gold-d),0 0 26px rgba(245,197,66,.45),inset 0 3px 10px rgba(255,255,255,.25);
}
.marquee small{display:block;font-size:13px;letter-spacing:.32em;color:var(--gold-l);text-shadow:0 1px 0 #000}
.marquee h1{
  font-family:"Yeseva One",Georgia,serif;font-weight:400;font-size:clamp(40px,14vw,58px);line-height:1;margin-top:2px;
  background:linear-gradient(180deg,#fffbe0 0%,var(--gold) 45%,#c88a17 60%,#ffe58a 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 2px 0 #4a0308) drop-shadow(0 0 10px rgba(255,210,90,.55));
}
.bulbs{position:absolute;left:14px;right:14px;bottom:-9px;display:flex;justify-content:space-between;pointer-events:none}
.bulbs i{width:10px;height:10px;border-radius:50%;background:#fff6c9;box-shadow:0 0 8px 2px #ffd95a;animation:blink 1s steps(1) infinite}
.bulbs i:nth-child(odd){animation-delay:.5s}
.party .bulbs i{animation-duration:.24s}
@keyframes blink{0%{opacity:1}50%{opacity:.25}}

/* ---------- cabinet ---------- */
.cabinet{
  display:flex;gap:6px;align-items:stretch;padding:12px 6px 12px 12px;border-radius:18px;margin-top:6px;
  background:linear-gradient(180deg,#c21528,var(--red) 40%,var(--red-d));
  border:3px solid var(--gold);box-shadow:0 0 0 3px var(--gold-d),0 10px 30px rgba(0,0,0,.6),inset 0 2px 8px rgba(255,255,255,.2);
}
.window{
  position:relative;flex:1;display:grid;grid-template-columns:repeat(3,1fr);gap:5px;padding:6px;border-radius:12px;
  background:linear-gradient(180deg,#6b4a0c,#f5c542 18%,#fff1b0 50%,#f5c542 82%,#6b4a0c);
  box-shadow:inset 0 0 0 2px #7a520e,0 2px 0 rgba(255,255,255,.3);
}
.reel{position:relative;overflow:hidden;aspect-ratio:1/3;border-radius:7px;background:var(--cream);box-shadow:inset 0 0 0 1px #b99a55}
.reel::after{content:"";position:absolute;inset:0;pointer-events:none;z-index:3;
  background:linear-gradient(180deg,rgba(40,20,0,.55) 0%,rgba(40,20,0,0) 20%,rgba(255,255,255,.12) 50%,rgba(40,20,0,0) 80%,rgba(40,20,0,.55) 100%)}
.strip{position:absolute;left:0;right:0;top:0;display:flex;flex-direction:column;will-change:transform}
.strip.blur{filter:blur(1.2px)}
.cell{width:100%;aspect-ratio:1;display:grid;place-items:center;border-bottom:1px solid rgba(150,110,40,.25)}
.sym{
  position:relative;width:86%;aspect-ratio:1;border-radius:50%;padding:6%;
  background:conic-gradient(from 20deg,#fff3b8,#d49a1e,#fff3b8,#b47a10,#ffe993,#d49a1e,#fff3b8);
  box-shadow:0 2px 5px rgba(0,0,0,.45),inset 0 0 0 1px #8a5d0c;
}
.sym img{display:block;width:100%;height:100%;border-radius:50%;object-fit:cover;border:3px solid var(--c);pointer-events:none;-webkit-user-drag:none}
.badge{
  position:absolute;left:50%;bottom:-7%;transform:translateX(-50%);min-width:44%;padding:1px 6px;border-radius:999px;text-align:center;
  font-size:clamp(11px,3.6vw,15px);line-height:1.35;color:var(--gold-l);background:var(--c);
  border:2px solid var(--gold);box-shadow:0 1px 3px rgba(0,0,0,.5);white-space:nowrap;
}
.cell.win .sym{animation:pop .5s ease-in-out infinite alternate;box-shadow:0 0 0 3px #fff,0 0 18px 6px #ffd95a}
@keyframes pop{to{transform:scale(1.09)}}
.lines{position:absolute;inset:6px;width:calc(100% - 12px);height:calc(100% - 12px);pointer-events:none;z-index:5;overflow:visible}
.lines polyline{fill:none;stroke-width:5;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:420;stroke-dashoffset:420;
  animation:draw .45s ease-out forwards;filter:drop-shadow(0 0 4px rgba(255,255,255,.9))}
@keyframes draw{to{stroke-dashoffset:0}}

/* ---------- lever ---------- */
.lever{position:relative;width:52px;flex:none;touch-action:none;cursor:grab}
.lever .slot{position:absolute;left:50%;top:8%;bottom:8%;width:14px;transform:translateX(-50%);border-radius:8px;
  background:linear-gradient(90deg,#1a0508,#3a0a10,#1a0508);box-shadow:inset 0 0 4px #000,0 0 0 2px var(--gold-d)}
.lever .pivot{position:absolute;left:50%;top:50%;width:26px;height:26px;transform:translate(-50%,-50%);border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#fff,#bbb 40%,#555);box-shadow:0 2px 4px rgba(0,0,0,.6)}
.lever .stick{position:absolute;left:50%;width:8px;transform:translateX(-50%);border-radius:4px;
  background:linear-gradient(90deg,#777,#f4f4f4 45%,#888)}
.lever .knob{position:absolute;left:50%;width:40px;height:40px;transform:translate(-50%,-50%);border-radius:50%;
  background:radial-gradient(circle at 35% 28%,#ff9aa5,#e3182d 38%,#7a0612);box-shadow:0 4px 8px rgba(0,0,0,.6),inset 0 -3px 6px rgba(0,0,0,.35)}
.lever .hint{position:absolute;left:50%;bottom:-2px;transform:translateX(-50%);font-size:9px;letter-spacing:.08em;color:var(--gold);white-space:nowrap;animation:bob 1s ease-in-out infinite alternate}
.lever.off{cursor:default}.lever.off .hint{visibility:hidden}
@keyframes bob{to{transform:translate(-50%,-4px)}}

/* ---------- panel ---------- */
.panel{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
.led{background:#120003;border:2px solid var(--gold-d);border-radius:10px;padding:5px 4px 6px;text-align:center;box-shadow:inset 0 0 10px #000}
.led span{display:block;font-size:10px;letter-spacing:.14em;color:#d9a441}
.led b{display:block;font-weight:400;font-size:clamp(17px,5.6vw,23px);color:#ff4a3d;text-shadow:0 0 8px rgba(255,60,40,.8);font-variant-numeric:tabular-nums;white-space:nowrap}
.led.win b{color:#ffe14d;text-shadow:0 0 8px rgba(255,220,60,.9)}
.betrow{display:flex;gap:8px;align-items:center}
.btn{font:inherit;border:0;cursor:pointer;color:var(--ink);border-radius:12px;
  background:linear-gradient(180deg,#fff3b8,var(--gold) 50%,#c88a17);box-shadow:0 4px 0 #7a520e,0 6px 10px rgba(0,0,0,.5)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #7a520e}
.btn:disabled{filter:grayscale(.7) brightness(.7)}
.btn.sq{width:52px;height:46px;font-size:26px;flex:none}
.msg{flex:1;text-align:center;font-size:14px;line-height:1.25;color:var(--gold-l);min-height:36px;display:grid;place-items:center;padding:0 4px}
.claim{display:none;width:100%;height:58px;font-size:22px;letter-spacing:.06em;
  background:linear-gradient(180deg,#b8ffb0,#2fbf4a 50%,#0f7a25);color:#04260b;box-shadow:0 4px 0 #0a4a17,0 0 22px rgba(80,255,120,.7);animation:pulse .7s ease-in-out infinite alternate}
.claim.on{display:block}
@keyframes pulse{to{transform:scale(1.03);box-shadow:0 4px 0 #0a4a17,0 0 34px rgba(120,255,150,.95)}}
.foot{display:flex;justify-content:space-between;align-items:center;font-size:10px;color:#b98a3a;letter-spacing:.06em}
.foot button{font:inherit;background:none;border:1px solid #7a520e;color:var(--gold);border-radius:8px;padding:4px 8px}

/* ---------- overlays ---------- */
.overlay{position:fixed;inset:0;z-index:50;display:none;place-items:center;background:rgba(8,0,2,.84);padding:16px}
.overlay.on{display:grid}
.card{width:100%;max-width:340px;text-align:center;padding:20px 18px;border-radius:20px;
  background:linear-gradient(180deg,#c21528,var(--red) 40%,var(--red-d));border:3px solid var(--gold);box-shadow:0 0 0 3px var(--gold-d),0 20px 50px #000}
.card h2{font-family:"Yeseva One",Georgia,serif;font-weight:400;font-size:26px;color:var(--gold);text-shadow:0 2px 0 #4a0308}
.card p{font-size:13px;margin-top:6px;color:var(--gold-l);font-family:system-ui,sans-serif;font-weight:600}
.pinbox{display:flex;justify-content:center;gap:10px;margin:14px 0 6px}
.pinbox i{width:54px;height:62px;border-radius:10px;background:#120003;border:2px solid var(--gold-d);display:grid;place-items:center;
  font-style:normal;font-size:34px;color:#ff4a3d;text-shadow:0 0 8px rgba(255,60,40,.8)}
.pinerr{height:18px;font-size:12px;color:#ffd0d0}
.shake{animation:shake .4s}
@keyframes shake{20%{transform:translateX(-9px)}40%{transform:translateX(9px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
.keys .btn{height:50px;font-size:22px}
.keys .ghost{background:none;box-shadow:none;color:var(--gold);border:1px solid var(--gold-d)}
#fx{position:fixed;inset:0;width:100%;height:100%;z-index:60;pointer-events:none}
.prize{z-index:55}
.prize .card{animation:rise .6s cubic-bezier(.2,1.4,.4,1) both}
@keyframes rise{from{transform:scale(.4) translateY(60px);opacity:0}}
.qr{width:210px;height:210px;margin:14px auto 12px;background:#fff;border-radius:12px;padding:8px;border:3px solid var(--gold)}
.qr img{width:100%;height:100%;display:block;object-fit:contain}
.prize .btn{width:100%;height:50px;font-size:17px}
.prize .note{font-size:11px;min-height:15px;margin-top:8px;font-weight:400}
.link{margin-top:10px;background:none;border:0;font:inherit;font-size:12px;color:var(--gold-l);text-decoration:underline}
</style>
</head>
<body>
<main class="machine" id="machine">
  <header class="marquee">
    <small>С ДНЁМ РОЖДЕНИЯ</small>
    <h1>ЮЛЯ!</h1>
    <div class="bulbs" id="bulbs"></div>
  </header>

  <section class="cabinet">
    <div class="window" id="window">
      <div class="reel"><div class="strip"></div></div>
      <div class="reel"><div class="strip"></div></div>
      <div class="reel"><div class="strip"></div></div>
      <svg class="lines" id="lines" viewBox="0 0 300 300" preserveAspectRatio="none"></svg>
    </div>
    <div class="lever" id="lever" role="button" aria-label="Рычаг: дёрнуть">
      <div class="slot"></div><div class="stick" id="stick"></div><div class="pivot"></div><div class="knob" id="knob"></div>
      <div class="hint">ТЯНИ ▼</div>
    </div>
  </section>

  <section class="panel">
    <div class="led"><span>БАЛАНС</span><b id="balance">0</b></div>
    <div class="led"><span>СТАВКА</span><b id="bet">0</b></div>
    <div class="led win"><span>ВЫИГРЫШ</span><b id="won">0</b></div>
  </section>

  <section class="betrow">
    <button class="btn sq" id="minus" aria-label="Уменьшить ставку">−</button>
    <div class="msg" id="msg">Выбери ставку и дёрни рычаг!</div>
    <button class="btn sq" id="plus" aria-label="Увеличить ставку">+</button>
  </section>

  <button class="btn claim" id="claim">💰 ЗАБРАТЬ БАБКИ</button>

  <footer class="foot"><span>5 ЛИНИЙ · СТАВКА 1 000 – 5 000</span><button id="mute">🔊 звук</button></footer>
</main>

<div class="overlay" id="pinOv">
  <div class="card" id="pinCard">
    <h2>Касса</h2>
    <p>Введи пин-код, чтобы забрать выигрыш</p>
    <div class="pinbox"><i id="p0"></i><i id="p1"></i></div>
    <div class="pinerr" id="pinErr"></div>
    <div class="keys" id="keys"></div>
  </div>
</div>

<canvas id="fx"></canvas>

<div class="overlay prize" id="prizeOv">
  <div class="card">
    <h2>С днём рождения, Юля!</h2>
    <p>Джекпот твой. Сканируй код и забирай подарок 🎁</p>
    <div class="qr"><img id="qrImg" alt="QR-код подарка"></div>
    <button class="btn" id="dl">⬇ Скачать QR-код</button>
    <p class="note" id="dlNote"></p>
    <button class="link" id="again">Сыграть ещё</button>
  </div>
</div>

const SYMS = [
  {b:"🍒", m:2, c:"#c8102e", img:IMGS[2]},
  {b:"🍋", m:3, c:"#b98400", img:IMGS[5]},
  {b:"🔔", m:4, c:"#1f7a4d", img:IMGS[4]},
  {b:"⭐", m:5, c:"#1d4fa3", img:IMGS[1]},
  {b:"BAR",m:6, c:"#1b1b1b", img:IMGS[3]},
  {b:"7",  m:8, c:"#c8102e", img:IMGS[0]},
];
const LINES = [[0,0,0],[1,1,1],[2,2,2],[0,1,2],[2,1,0]];   // строка для каждого барабана
const LINE_COLORS = ["#ff3b3b","#ffd400","#22c55e","#38bdf8","#e879f9"];

/* ====== СОСТОЯНИЕ ====== */
let balance = START, bet = 1000, spins = 0, spinning = false, jackpotDone = false, shown = START;
let grid = [[0,1,2],[3,4,5],[2,0,4]];
const $ = id => document.getElementById(id);
const fmt = n => Math.round(n).toLocaleString("ru-RU");
const rnd = n => Math.floor(Math.random()*n);
const strips = [...document.querySelectorAll(".strip")];

/* ====== ЗВУК ====== */
let ac = null, muted = false;
function tone(f, t=0, d=.12, type="square", v=.06){
  if(muted) return;
  try{
    ac = ac || new (window.AudioContext||window.webkitAudioContext)();
    if(ac.state==="suspended") ac.resume();
    const o=ac.createOscillator(), g=ac.createGain(), s=ac.currentTime+t;
    o.type=type; o.frequency.value=f; g.gain.setValueAtTime(v,s); g.gain.exponentialRampToValueAtTime(.0001,s+d);
    o.connect(g).connect(ac.destination); o.start(s); o.stop(s+d+.02);
  }catch(e){}
}
const sfx = {
  pull(){tone(140,0,.18,"sawtooth",.07)},
  stop(){tone(220,0,.07,"square",.08)},
  win(){[523,659,784,1047].forEach((f,i)=>tone(f,i*.09,.16))},
  lose(){tone(160,0,.2,"triangle",.05)},
  jackpot(){[523,659,784,1047,784,1047,1319,1568].forEach((f,i)=>tone(f,i*.11,.22));for(let i=0;i<14;i++)tone(1800+rnd(900),.9+i*.07,.06,"triangle",.04)},
  key(){tone(660,0,.05)}, bad(){tone(120,0,.3,"sawtooth",.07)},
};

/* ====== ОТРИСОВКА ====== */
function cellHTML(s){
  const S=SYMS[s];
  return `<div class="cell"><div class="sym" style="--c:${S.c}"><img src="${S.img}" alt=""><span class="badge">${S.b}</span></div></div>`;
}
function renderStatic(){
  strips.forEach((st,c)=>{st.style.transition="none";st.style.transform="translateY(0)";st.classList.remove("blur");st.innerHTML=grid[c].map(cellHTML).join("")});
}
function updatePanel(){
  bet = Math.max(BET_MIN, Math.min(bet, BET_MAX, Math.floor(balance/BET_STEP)*BET_STEP || BET_MIN));
  $("bet").textContent = fmt(bet);
  $("minus").disabled = spinning || bet<=BET_MIN;
  $("plus").disabled  = spinning || bet>=Math.min(BET_MAX,balance);
  $("claim").classList.toggle("on", balance>=GOAL && !spinning);
  $("lever").classList.toggle("off", spinning);
}
function animateBalance(to){
  const from=shown, t0=performance.now(), dur=Math.min(1600,300+Math.abs(to-from)/20);
  (function step(t){
    const k=Math.min(1,(t-t0)/dur); shown=from+(to-from)*k; $("balance").textContent=fmt(shown);
    if(k<1) requestAnimationFrame(step); else shown=to;
  })(t0);
}
const say = t => $("msg").textContent = t;

/* ====== ЛОГИКА ВЫПАДЕНИЯ ====== */
const randGrid = () => [0,1,2].map(()=>[rnd(6),rnd(6),rnd(6)]);
function evaluate(g){
  const w=[];
  LINES.forEach((L,i)=>{const s=g[0][L[0]]; if(g[1][L[1]]===s && g[2][L[2]]===s) w.push({line:i,sym:s})});
  return w;
}
const payout = w => w.reduce((a,x)=>a+bet*SYMS[x.sym].m,0);
function loseGrid(){ let g; do{ g=randGrid() }while(evaluate(g).length); return g }
function decide(){
  // джекпот (все ряды) возможен только после 10 вращений
  if(!jackpotDone && spins>10 && Math.random() < (spins===11?.4:spins===12?.7:1)){
    jackpotDone = true;
    return [0,1,2].map(()=>[5,5,5]);
  }
  const cap = jackpotDone ? Infinity : GOAL - balance;      // до джекпота планка 20 000 не берётся
  const force = balance < 3000;                              // не даём проиграться в ноль
  if(force || Math.random()<.38){
    for(let i=0;i<400;i++){
      const g=randGrid(), L=LINES[rnd(5)], s=Math.floor(Math.pow(Math.random(),1.7)*6);
      [0,1,2].forEach(c=>g[c][L[c]]=s);
      const w=evaluate(g);
      if(w.length<=2 && payout(w)<cap) return g;
    }
  }
  return loseGrid();
}

/* ====== ВРАЩЕНИЕ ====== */
function spin(){
  if(spinning) return;
  if(balance<bet){ updatePanel(); }
  spinning = true; spins++;
  balance -= bet; animateBalance(balance);
  $("won").textContent="0"; $("lines").innerHTML=""; say(`Вращение №${spins}…`);
  document.querySelectorAll(".cell.win").forEach(c=>c.classList.remove("win"));
  updatePanel();
  const next = decide();
  strips.forEach((st,c)=>{
    const filler = 18 + c*9, seq=[...next[c]];
    for(let i=0;i<filler;i++) seq.push(rnd(6));
    seq.push(...grid[c]);
    const n=seq.length, dur=1.5+c*.55;
    st.style.transition="none";
    st.innerHTML=seq.map(cellHTML).join("");
    st.style.transform=`translateY(${-(n-3)/n*100}%)`;
    st.classList.add("blur");
    st.getBoundingClientRect();
    st.style.transition=`transform ${dur}s cubic-bezier(.2,.75,.25,1.03)`;
    st.style.transform="translateY(0)";
    setTimeout(()=>{st.classList.remove("blur")},dur*1000-350);
    setTimeout(()=>{sfx.stop(); if(c===2) finish(next)},dur*1000+30);
  });
}
function finish(next){
  grid = next; renderStatic();
  const w = evaluate(grid), total = payout(w), jackpot = w.length===5;
  const svg=$("lines");
  w.forEach((x,i)=>{
    const L=LINES[x.line], y=r=>50+r*100;
    const p=document.createElementNS("http://www.w3.org/2000/svg","polyline");
    p.setAttribute("points",`6,${y(L[0])} 50,${y(L[0])} 150,${y(L[1])} 250,${y(L[2])} 294,${y(L[2])}`);
    p.setAttribute("stroke",LINE_COLORS[x.line]); p.style.animationDelay=(i*.18)+"s";
    p.setAttribute("vector-effect","non-scaling-stroke");
    svg.appendChild(p);
    [0,1,2].forEach(c=>strips[c].children[L[c]].classList.add("win"));
  });
  if(total){
    balance += total; $("won").textContent=fmt(total); animateBalance(balance);
    if(jackpot){
      sfx.jackpot(); $("machine").classList.add("party");
      say("🎰 ДЖЕКПОТ! Все ряды совпали! Забирай бабки!");
    }else{
      sfx.win(); say(w.length>1?`Две линии! +${fmt(total)}`:`Линия ${SYMS[w[0].sym].b}! +${fmt(total)}`);
    }
  }else{
    sfx.lose();
    const left = 10 - spins;
    say(jackpotDone ? "Мимо. Крути ещё!" : left>0 ? `Мимо. До шанса на джекпот: ${left}` : "Джекпот уже рядом — тяни!");
  }
  setTimeout(()=>{spinning=false; updatePanel()}, total?700:250);
}

/* ====== РЫЧАГ ====== */
const lever=$("lever"), knob=$("knob"), stick=$("stick");
let pull=0, drag=null;
function setPull(p){
  pull=Math.max(0,Math.min(1,p));
  const h=lever.clientHeight, top=h*.12, bottom=h*.86, y=top+(bottom-top)*pull, mid=h/2;
  knob.style.top=y+"px";
  stick.style.top=Math.min(y,mid)+"px"; stick.style.height=Math.abs(y-mid)+"px";
}
function release(from, fire){
  const t0=performance.now();
  (function step(t){
    const k=Math.min(1,(t-t0)/380), e=1-Math.pow(1-k,3);
    setPull(from*(1-e)); if(k<1) requestAnimationFrame(step);
  })(t0);
  if(fire) spin();
}
function autoPull(){
  const t0=performance.now();
  (function step(t){
    const k=Math.min(1,(t-t0)/180); setPull(k);
    if(k<1) requestAnimationFrame(step); else release(1,true);
  })(t0);
}
lever.addEventListener("pointerdown",e=>{
  if(spinning) return;
  drag={y:e.clientY,moved:0}; try{lever.setPointerCapture(e.pointerId)}catch(_){}
});
lever.addEventListener("pointermove",e=>{
  if(!drag) return;
  const d=e.clientY-drag.y; drag.moved=Math.max(drag.moved,Math.abs(d));
  setPull(d/(lever.clientHeight*.7));
});
function up(){
  if(!drag) return;
  const tap = drag.moved<8; drag=null;
  if(tap){ sfx.pull(); autoPull(); }
  else if(pull>.55){ sfx.pull(); release(pull,true); }
  else release(pull,false);
}
lever.addEventListener("pointerup",up); lever.addEventListener("pointercancel",up);
addEventListener("resize",()=>setPull(pull));

/* ====== СТАВКА ====== */
$("minus").onclick=()=>{bet-=BET_STEP;sfx.key();updatePanel()};
$("plus").onclick=()=>{bet+=BET_STEP;sfx.key();updatePanel()};
$("mute").onclick=e=>{muted=!muted;e.currentTarget.textContent=muted?"🔇 звук":"🔊 звук"};

/* ====== ПИН-КОД ====== */
let pin="";
const keys=$("keys");
["1","2","3","4","5","6","7","8","9","✕","0","⌫"].forEach(k=>{
  const b=document.createElement("button"); b.className="btn"+(k==="✕"||k==="⌫"?" ghost":""); b.textContent=k;
  b.onclick=()=>pressKey(k); keys.appendChild(b);
});
function drawPin(){ $("p0").textContent=pin[0]?"●":""; $("p1").textContent=pin[1]?"●":"" }
function pressKey(k){
  sfx.key(); $("pinErr").textContent="";
  if(k==="✕"){ $("pinOv").classList.remove("on"); return }
  if(k==="⌫"){ pin=pin.slice(0,-1); drawPin(); return }
  if(pin.length>=PIN.length) return;
  pin+=k; drawPin();
  if(pin.length===PIN.length) setTimeout(checkPin,220);
}
function checkPin(){
  if(pin===PIN){ $("pinOv").classList.remove("on"); celebrate(); }
  else{
    sfx.bad(); $("pinErr").textContent="Неверный пин-код. Попробуй ещё";
    const c=$("pinCard"); c.classList.remove("shake"); void c.offsetWidth; c.classList.add("shake");
    pin=""; drawPin();
  }
}
$("claim").onclick=()=>{ pin=""; drawPin(); $("pinErr").textContent=""; $("pinOv").classList.add("on") };

/* ====== ВЗРЫВ КУПЮР ====== */
const fx=$("fx"), ctx=fx.getContext("2d");
let bills=[], fxOn=false;
function billSprite(){
  const c=document.createElement("canvas"); c.width=120; c.height=56; const x=c.getContext("2d");
  x.fillStyle="#cfe8c4"; x.fillRect(0,0,120,56);
  x.strokeStyle="#2e6b3a"; x.lineWidth=3; x.strokeRect(3,3,114,50);
  x.lineWidth=1; x.strokeRect(8,8,104,40);
  x.fillStyle="#2e6b3a"; x.beginPath(); x.ellipse(60,28,17,17,0,0,7); x.fill();
  x.fillStyle="#e9f7e2"; x.font="bold 22px Georgia,serif"; x.textAlign="center"; x.textBaseline="middle"; x.fillText("Ю",60,29);
  x.fillStyle="#2e6b3a"; x.font="bold 11px Arial"; x.fillText("36",20,17); x.fillText("36",100,41);
  return c;
}
const sprite=billSprite();
function sizeFx(){ const d=Math.min(2,devicePixelRatio||1); fx.width=innerWidth*d; fx.height=innerHeight*d; ctx.setTransform(d,0,0,d,0,0) }
function burst(n,cx,cy,power){
  for(let i=0;i<n;i++){
    const a=Math.random()*Math.PI*2, v=power*(.35+Math.random());
    bills.push({x:cx,y:cy,vx:Math.cos(a)*v,vy:Math.sin(a)*v-power*.5,r:Math.random()*6,vr:(Math.random()-.5)*.3,f:Math.random()*6,vf:.1+Math.random()*.2,s:.45+Math.random()*.5});
  }
}
function fxLoop(){
  ctx.clearRect(0,0,innerWidth,innerHeight);
  bills=bills.filter(b=>b.y<innerHeight+80);
  for(const b of bills){
    b.vy+=.28; b.vx*=.985; b.vy=Math.min(b.vy,7); b.x+=b.vx; b.y+=b.vy; b.r+=b.vr; b.f+=b.vf;
    ctx.save(); ctx.translate(b.x,b.y); ctx.rotate(b.r); ctx.scale(b.s,b.s*Math.cos(b.f));
    ctx.drawImage(sprite,-60,-28); ctx.restore();
  }
  if(bills.length) requestAnimationFrame(fxLoop); else{ fxOn=false; ctx.clearRect(0,0,innerWidth,innerHeight) }
}
function celebrate(){
  sizeFx(); sfx.jackpot();
  const cx=innerWidth/2, cy=innerHeight*.45;
  burst(110,cx,cy,17);
  setTimeout(()=>burst(70,cx*.5,cy,13),350);
  setTimeout(()=>burst(70,cx*1.5,cy,13),650);
  if(!fxOn){ fxOn=true; requestAnimationFrame(fxLoop) }
  setTimeout(()=>$("prizeOv").classList.add("on"),1500);
}
addEventListener("resize",()=>{ if(fxOn) sizeFx() });

/* ====== QR-КОД ====== */
function qrPlaceholder(){
  const c=document.createElement("canvas"); c.width=c.height=600; const x=c.getContext("2d");
  x.fillStyle="#fff"; x.fillRect(0,0,600,600);
  x.setLineDash([22,16]); x.lineWidth=8; x.strokeStyle="#a80f1f"; x.strokeRect(40,40,520,520);
  x.fillStyle="#a80f1f"; x.textAlign="center"; x.font="bold 76px Georgia,serif"; x.fillText("QR-код",300,280);
  x.fillStyle="#333"; x.font="34px Arial"; x.fillText("скоро появится здесь",300,350);
  return c.toDataURL("image/png");
}
const QR_FILE = "qr.jpg";      // файл с QR-кодом лежит рядом с index.html
let qrIsFile = true;
const qrImg = $("qrImg");
qrImg.onerror = () => { if(qrIsFile){ qrIsFile=false; qrImg.src=qrPlaceholder(); } };
qrImg.src = QR_FILE;
function dataURLtoBlob(u){
  const [h,b]=u.split(","), bin=atob(b), a=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) a[i]=bin.charCodeAt(i);
  return new Blob([a],{type:"image/png"});
}
$("dl").onclick=async()=>{
  const note=$("dlNote"), name=qrIsFile?"qr-podarok-yule.jpg":"qr-podarok-yule.png";
  const hold="Если файл не скачался — зажми картинку и выбери «Сохранить»";
  note.textContent="";
  try{
    let blob=null;
    if(qrIsFile){ try{ const r=await fetch(QR_FILE); if(r.ok) blob=await r.blob(); }catch(_){} }
    else blob=dataURLtoBlob(qrImg.src);
    const d = window.claude && window.claude.use ? await window.claude.use("downloads") : null;
    if(d && blob){ await d.save({filename:name,data:blob}); note.textContent="Сохранено ✔"; return }
    const a=document.createElement("a"); a.href=blob?URL.createObjectURL(blob):QR_FILE; a.download=name;
    document.body.appendChild(a); a.click(); a.remove();
    note.textContent=hold;
  }catch(e){
    note.textContent = e && e.code==="declined" ? "Скачивание отменено" : hold;
  }
};
$("again").onclick=()=>$("prizeOv").classList.remove("on");

/* ====== СТАРТ ====== */
$("bulbs").innerHTML="<i></i>".repeat(15);
renderStatic(); updatePanel(); $("balance").textContent=fmt(balance); setPull(0);
</script>
